server:
  port: 8080

spring:
  application:
    name: vtu-student-connect-api
  
  # DataSource Configuration: Connected to MySQL Database
  datasource:
    url: jdbc:mysql://localhost:3306/vtu_student_connect?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:081506}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false

  # File upload limits for syllabus notes and PDFs (50MB)
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# JWT Security Configuration
vtuconnect:
  security:
    jwt:
      secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      expiration-ms: 86400000 # 24 Hours
      refresh-expiration-ms: 604800000 # 7 Days
